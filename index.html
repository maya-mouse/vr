<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Task: AR Ding-Dong Complete</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        #ar-debug-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 85%;
            max-height: 150px;
            background: rgba(0, 0, 0, 0.75);
            color: #10b981;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 5px;
            overflow-y: auto;
            z-index: 999999;
            pointer-events: none;
            border: 1px solid #10b981;
        }
    </style>

    <script>
        function logToScreen(message) {
            const panel = document.getElementById('ar-debug-panel');
            if (panel) {
                panel.innerHTML += message + "<br>";
                panel.scrollTop = panel.scrollHeight;
            }
        }

  
        AFRAME.registerComponent('ding-dong-surface', {
            init: function () {
                logToScreen("Ініціалізація геометрії Дін-Донга...");
                
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const indices = [];

                function dingDong_param(u, v, a = 1.0) {
                    if (v >= 1.0) v = 0.9999;

                    let r = Math.abs(a * v * Math.sqrt(1.0 - v));
                    let x = r * Math.cos(u);
                    let y = r * Math.sin(u);
                    let z = a * v;
                    return { x: x, y: y, z: z };
                }

                const uCount = 60;
                const vCount = 60;


                const uMin = 0, uMax = 2 * Math.PI;
                const vMin = -2.0, vMax = 0.999;

                for (let i = 0; i < uCount; i++) {
                    let u = uMin + i * (uMax - uMin) / (uCount - 1);
                    for (let j = 0; j < vCount; j++) {
                        let v = vMin + j * (vMax - vMin) / (vCount - 1);
                        let p = dingDong_param(u, v, 1.0);
                        vertices.push(p.x * 0.35, p.z * 0.35, p.y * 0.35); 
                    }
                }


                for (let i = 0; i < uCount - 1; i++) {
                    for (let j = 0; j < vCount - 1; j++) {
                        let v0 = i * vCount + j;
                        let v1 = i * vCount + (j + 1);
                        let v2 = (i + 1) * vCount + j;
                        let v3 = (i + 1) * vCount + (j + 1);
                        
                 
                        indices.push(v0, v1, v2);
                        indices.push(v1, v3, v2);
                    }
                }


                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();

                const matSolid = new THREE.MeshPhongMaterial({
                    color: 0x059669,       
                    shininess: 80,        
                    transparent: true,
                    opacity: 0.85,         
                    side: THREE.DoubleSide
                });
                

                const matWire = new THREE.MeshBasicMaterial({
                    color: 0x6ee7b7,      
                    wireframe: true,
                    transparent: true,
                    opacity: 0.45
                });

                const meshSolid = new THREE.Mesh(geometry, matSolid);
                const meshWire = new THREE.Mesh(geometry, matWire);
                
                const group = new THREE.Group();
                group.add(meshSolid);
                group.add(meshWire);
                
        
                const light = new THREE.PointLight(0xffffff, 1.2, 10);
                light.position.set(2, 3, 2);
                group.add(light);


                const backLight = new THREE.PointLight(0xa7f3d0, 0.5, 5);
                backLight.position.set(-2, -2, -2);
                group.add(backLight);

                this.el.setObject3D('mesh', group);
                logToScreen("✨ Фігура успішно згенерована та додана!");
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const marker = document.querySelector('a-marker');
            logToScreen("Очікування камери та пошук AR-маркера...");
            
            marker.addEventListener('markerFound', () => {
                logToScreen("🟢 МАРКЕР ЗНАЙДЕНО! Малюю оновлену фігуру...");
            });

            marker.addEventListener('markerLost', () => {
                logToScreen("🔴 Маркер втрачено з поля зору.");
            });
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="ar-debug-panel">Система відладки AR Дін-Донг активована:<br></div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-marker type="pattern" url="pattern-cw.patt" smooth="true" smoothCount="5">
            <a-entity
                    ding-dong-surface
                    position="0 0 0"
                    rotation="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
