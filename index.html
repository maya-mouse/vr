<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Task: AR Surface</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('ding-dong-surface', {
            init: function () {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const indices = [];

                function dingDong_param(u, v, a = 1.0) {
                    if (v >= 1.0) v = 0.9999;
                    let oneMinusV = 1.0 - v;
                    if (oneMinusV < 0) oneMinusV = 0;
                    let r = a * v * Math.sqrt(oneMinusV);
                    return {
                        x: r * Math.cos(u),
                        y: r * Math.sin(u),
                        z: a * v
                    };
                }

                const uCount = 40;
                const vCount = 30;
                
                const uMin = 0.0, uMax = 2.0 * Math.PI;

                const vMin = 0.0, vMax = 0.9999; 

                const deltaU = (uMax - uMin) / (uCount - 1);
                const deltaV = (vMax - vMin) / (vCount - 1);

                for (let i = 0; i < uCount; i++) {
                    let u = uMin + i * deltaU;
                    for (let j = 0; j < vCount; j++) {
                        let v = vMin + j * deltaV;
                        let p = dingDong_param(u, v, 1.0);
                        

                        vertices.push(p.x, p.z, p.y); 
                    }
                }

                for (let i = 0; i < uCount - 1; i++) {
                    for (let j = 0; j < vCount - 1; j++) {
                        let v0 = i * vCount + j;
                        let v1 = i * vCount + (j + 1);
                        let v2 = (i + 1) * vCount + j;
                        let v3 = (i + 1) * vCount + (j + 1);

                        indices.push(v0, v1, v2);
                        indices.push(v1, v3, v2);
                    }
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(indices);
                

                geometry.computeVertexNormals();

                const matSolid = new THREE.MeshNormalMaterial({
                    side: THREE.DoubleSide,
                    wireframe: false,
                    transparent: true,
                    opacity: 0.7
                });
                

                const matWire = new THREE.MeshBasicMaterial({
                    color: 0x333333,
                    wireframe: true
                });

                const meshSolid = new THREE.Mesh(geometry, matSolid);
                const meshWire = new THREE.Mesh(geometry, matWire);

                const group = new THREE.Group();
                group.add(meshSolid);
                group.add(meshWire);

                group.position.set(0, 0, 0);

                this.el.setObject3D('mesh', group);
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
<a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker type="pattern" url="pattern-img.patt" smooth="true" smoothCount="5">
        <a-entity
                ding-dong-surface
                position="0 0 0"
                scale="0.8 0.8 0.8"
                rotation="-90 0 0">
        </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>
</body>
</html>
