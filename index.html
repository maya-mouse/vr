<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Control Task - AR Registration Template</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        // Математична функція поверхні Дін-Донга з твоїх попередніх робіт
        function dingDong_param(u, v, a = 1.0) {
            if (v >= 1.0) v = 0.999999;
            let oneMinusV = 1.0 - v;
            if (oneMinusV < 0) oneMinusV = 0;
            let r = a * v * Math.sqrt(oneMinusV);
            let x = r * Math.cos(u);
            let y = r * Math.sin(u);
            let z = a * v;
            return { x: x, y: y, z: z };
        }

        // Реєструємо кастомний 3D-компонент для A-Frame, який побудує нашу фігуру
        AFRAME.registerComponent('ding-dong-surface', {
            schema: {
                uCount: { type: 'int', default: 40 },
                vCount: { type: 'int', default: 30 },
                scaleFactor: { type: 'number', default: 0.5 } // Масштаб, щоб вписати в маркер
            },
            init: function () {
                let el = this.el;
                let data = this.data;

                // Створюємо геометрію для каркасної сітки (Three.js використовується під капотом A-Frame)
                let geometry = new THREE.BufferGeometry();
                let vertices = [];
                let indices = [];

                let uMin = 0.0, uMax = 2.0 * Math.PI;
                let vMin = -2.0, vMax = 0.9999;

                let deltaU = (uMax - uMin) / (data.uCount - 1);
                let deltaV = (vMax - vMin) / (data.vCount - 1);

                // 1. Генеруємо масив точок поверхні
                let grid = [];
                for (let i = 0; i < data.uCount; i++) {
                    let u = uMin + i * deltaU;
                    grid[i] = [];
                    for (let j = 0; j < data.vCount; j++) {
                        let v = vMin + j * deltaV;
                        let p = dingDong_param(u, v, 1.0);
                        
                        // Застосовуємо масштаб та записуємо координати
                        let vx = p.x * data.scaleFactor;
                        let vy = p.y * data.scaleFactor;
                        let vz = p.z * data.scaleFactor;
                        
                        vertices.push(vx, vy, vz);
                        grid[i][j] = (vertices.length / 3) - 1; // індекс вершини
                    }
                }

                // 2. Створюємо індекси ліній для побудови сітки (ізолінії U та V)
                // Лінії вздовж U
                for (let i = 0; i < data.uCount; i++) {
                    for (let j = 0; j < data.vCount - 1; j++) {
                        indices.push(grid[i][j], grid[i][j+1]);
                    }
                }
                // Лінії вздовж V
                for (let j = 0; j < data.vCount; j++) {
                    for (let i = 0; i < data.uCount - 1; i++) {
                        indices.push(grid[i][j], grid[i+1][j]);
                    }
                }

                // Завантажуємо дані в Three.js геометрію
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
                geometry.setIndex(indices);

                // Створюємо матеріал для ліній каркасу (робимо яскраві бірюзові або рожеві лінії)
                let material = new THREE.LineBasicMaterial({ 
                    color: 0x00ffcc, 
                    linewidth: 2 
                });

                // Створюємо фінальний 3D-об'єкт ліній та додаємо його на сцену до маркера
                let lineSegments = new THREE.LineSegments(geometry, material);
                el.setObject3D('mesh', lineSegments);
            }
        });
    </script>
</head>

<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-marker type="pattern" url="./pattern-cw.patt">
            
            <a-entity 
                ding-dong-surface="uCount: 45; vCount: 30; scaleFactor: 0.8"
                position="0 0.2 0" 
                rotation="-90 0 0">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
